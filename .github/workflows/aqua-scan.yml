name: Test 3 - Manual TRIVY_SERVER_URL

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  aqua-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Aqua scanner - Manual TRIVY_SERVER_URL
        uses: docker://aquasec/aqua-scanner:dev
        with:
          args: trivy fs --scanners vuln,secret .
        env:
          AQUA_KEY: ${{ secrets.AQUA_KEY }}
          AQUA_SECRET: ${{ secrets.AQUA_SECRET }}
          AQUA_URL: https://api.dev.supply-chain.cloud.aquasec.com
          CSPM_URL: https://stage.api.cloudsploit.com
          TRIVY_SERVER_URL: https://us-east-1.staging.edge.cloud.aquasec.com  # Manually set
          TRIVY_RUN_AS_PLUGIN: aqua
          # Expected: Full scan with trivy-server features using manual URL
